[project]
name = "demandiq"
version = "0.1.0"
description = "Observed retail sales ingestion and traceable data queries."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.115,<1",
    "numpy>=2.5.3",
    "pandas>=2.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0,<2.1",
    "threadpoolctl>=3.6.0",
    "uvicorn>=0.34,<1",
]

[project.scripts]
demandiq = "demandiq.cli:main"

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["uv_build>=0.11.18,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a real disposable PostgreSQL database"]

